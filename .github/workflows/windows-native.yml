name: Windows Native Build

on: [push, pull_request]

jobs:
  build-native:
    name: Build Native PHP ${{ matrix.php-version }} on Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            os: windows-2019
          - php-version: '8.3'
            os: windows-2019
          - php-version: '8.4'
            os: windows-latest
          - php-version: '8.5'
            os: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run Native Build Script
        shell: powershell
        run: .\build-windows-native.ps1 -PhpVersions @("${{ matrix.php-version }}")
        
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swoole-windows-dll-php${{ matrix.php-version }}
          path: build-output/
