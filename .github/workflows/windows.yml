name: Windows tests
on: [push, pull_request]

jobs:
  windows-tests:
    name: Unit Test on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ 'windows-latest' ]
        ts: [ 'ts', 'nts' ]
        php: [ '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts }}
        with:
          php-version: ${{ matrix.php }}
          # ini-values: pcov.directory=lib
          # coverage: pcov
          coverage: none
          extensions: curl,openssl,pdo

      - name: Cache PHP deps and devpack
        id: cache-php
        uses: actions/cache@v5
        with:
          path: |
            C:\tools\phpdev\deps
            C:\tools\phpdev\php-*-devel-*-*
          key: php${{ matrix.php }}-${{ runner.os }}-${{ matrix.ts }}-v2
          restore-keys: |
            php${{ matrix.php }}-${{ runner.os }}-${{ matrix.ts }}-
            php${{ matrix.php }}-${{ runner.os }}-

      - name: Debug PHP devpack environment
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Devpack debug ==="
          $tools = 'C:\tools\phpdev'
          Write-Host "ToolsPath: $tools"
          if (Test-Path $tools) {
            Write-Host "Contents of $tools:"
            Get-ChildItem $tools -Force | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "$tools not found"
          }
          $envbat = Join-Path $tools 'env.bat'
          if (Test-Path $envbat) {
            Write-Host "\n--- env.bat content ---"
            Get-Content $envbat | ForEach-Object { Write-Host $_ }
            Write-Host "--- end env.bat ---\n"
          } else {
            Write-Host "env.bat not present at $envbat"
          }
          $deps = Join-Path $tools 'deps'
          if (Test-Path $deps) {
            Write-Host "Listing deps (top-level):"
            Get-ChildItem $deps -Force | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "deps dir not present at $deps"
          }
          Write-Host "=== End Devpack debug ==="

      - name: Build Swoole extension
        uses: ./.github/workflows/winext
        with:
          ext-path: .
          tools-path: C:\tools\phpdev
          conf-args: --enable-swoole-curl --enable-swoole-thread
          staging-deps: '1'
          deps: openssl,libcurl,libssh2,zlib,nghttp2,libzstd,brotli
          phpts: ${{ matrix.ts == 'ts' && '1' || '0' }}

      - name: Get PHP runtime version and DLL path
        id: php_version
        shell: powershell
        run: |
          $ver = php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
          Write-Output "php_version=$ver" | Out-File $env:GITHUB_OUTPUT -Append
          $extdir = php -r "echo ini_get('extension_dir');"
          Write-Output "php_extension_dir=$extdir" | Out-File $env:GITHUB_OUTPUT -Append
          $dll = Join-Path $extdir "php_swoole.dll"
          if (-Not (Test-Path $dll)) {
            throw "Could not find php_swoole.dll in $extdir"
          }
          Write-Output "dll_path=$dll" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload php_swoole.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: php_swoole-${{ steps.php_version.outputs.php_version }}-${{ matrix.ts }}
          path: ${{ steps.php_version.outputs.dll_path }}

      - name: Show Swoole extension info
        shell: powershell
        run: |
          php -d extension=php_swoole --ri swoole
